[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastpostgres"
version = "1.0.0"
description = "Python client for fastpostgres: columnar query results over POSIX shared memory"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Carlos Daniel", email = "105173667+carlosdaniel26@users.noreply.github.com" },
]
keywords = ["PostgreSQL", "shared memory", "zero-copy", "Arrow", "database driver"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# the dialect registers itself in SQLAlchemy; the DBAPI needs nothing else
sqlalchemy = ["sqlalchemy>=2.0"]

[project.urls]
Repository = "https://github.com/carlosdaniel26/fastpostgres"
Documentation = "https://github.com/carlosdaniel26/fastpostgres/blob/main/DOCUMENTATION.md"

[project.entry-points."sqlalchemy.dialects"]
"postgresql.fastpostgres" = "fastpostgres.dialect:PGDialect_fastpostgres"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["fastpostgres"]

[tool.setuptools.package-data]
fastpostgres = ["py.typed", "*.pyi"]
