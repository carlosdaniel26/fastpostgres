name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          pip install ruff
          ruff check python bench
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck bench/*/*.sh docker/*.sh examples/*.sh
      - name: markdown links
        run: python3 tools/check_links.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the dev image
        run: docker build --target dev -t fastpostgres-dev -f docker/Dockerfile .
      - name: pg_regress and the client suite
        run: docker run --rm --shm-size=3g fastpostgres-dev tests.sh
