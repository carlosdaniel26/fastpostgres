# The repository's Python lint, deliberately conservative: pyflakes plus the
# pycodestyle errors that are typos, not style arguments. Run from the root:
#   ruff check python bench

line-length = 100
extend-exclude = [
  "python/src/fastpostgres/native", # C++ sources, clang-format's business
  "bench/adoption/magicstack-pgbench", # vendored: upstream's own style
  "third_party",
  "data",
]

[lint]
select = ["E4", "E7", "E9", "F"]
