site_name: FastPostgres
site_description: PostgreSQL query results through POSIX shared memory, as typed arrays
site_url: https://carlosdaniel26.github.io/fastpostgres/
repo_url: https://github.com/carlosdaniel26/fastpostgres
repo_name: carlosdaniel26/fastpostgres
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Introduction: index.md
  - Benchmarks: BENCHMARKS.md
  - Records: RESULTS.md
  - Method: METHODOLOGY.md
  - Limits: LIMITATIONS.md
  - Why it wins: WHY-IT-WINS.md
  - Against a result cache: PG-CACHE.md
  - Against Arrow, in memory: ARROW-MEMORY.md
  - Codec x transport: CODEC-TRANSPORT.md
  - Decode notes: DECODE-NOTES.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

# The documents link to the repository around them - the README, the records
# under benchmarks/results/, the extension's headers - which are not site pages.
# tools/check_links.py validates every one of them; the site build should not
# repeat that check and fail on the links that leave docs/.
validation:
  links:
    not_found: ignore
    unrecognized_links: ignore
