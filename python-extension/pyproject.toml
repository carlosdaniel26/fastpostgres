[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastpostgres"
version = "1.0.0"
description = "Python client for fastpostgres: columnar query results over POSIX shared memory"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."sqlalchemy.dialects"]
"postgresql.fastpostgres" = "fastpostgres.dialect:PGDialect_fastpostgres"
