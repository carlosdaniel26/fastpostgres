[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastpostgres"
version = "1.0.0"
description = "Python client for fastpostgres: columnar query results over POSIX shared memory"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Carlos Daniel", email = "105173667+carlosdaniel26@users.noreply.github.com" },
]
keywords = ["PostgreSQL", "shared memory", "zero-copy", "Arrow", "database driver"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/carlosdaniel26/fastpostgres"

[tool.setuptools]
packages = ["fastpostgres"]

[project.entry-points."sqlalchemy.dialects"]
"postgresql.fastpostgres" = "fastpostgres.dialect:PGDialect_fastpostgres"
